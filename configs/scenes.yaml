defaults:
  maximum_frame_gap: 5
  minimum_movement_pixels: 3.0
  wrong_way_consecutive_observations: 8
  wrong_way_minimum_net_displacement_pixels: 20.0
  temporal_maximum_missing_seconds: 1.0

event_policy:
  severity:
    LINE_CROSSING: INFO
    ZONE_ENTRY: INFO
    ZONE_EXIT: INFO
    WRONG_WAY: CRITICAL
    LONG_DWELL: WARNING
    STATIONARY_VEHICLE: WARNING
    PEDESTRIAN_INTRUSION: WARNING
    PROXIMITY_WARNING: WARNING
  status:
    LINE_CROSSING: DETECTED
    ZONE_ENTRY: DETECTED
    ZONE_EXIT: DETECTED
    WRONG_WAY: REVIEW_REQUIRED
    LONG_DWELL: DETECTED
    STATIONARY_VEHICLE: REVIEW_REQUIRED
    PEDESTRIAN_INTRUSION: REVIEW_REQUIRED
    PROXIMITY_WARNING: REVIEW_REQUIRED

